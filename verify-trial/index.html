<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Verify your email — Haqiq</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" type="image/webp" href="../assets/haqiq-mark.webp" />
</head>
<body>
  <main class="shell" style="min-height:100vh;display:grid;place-items:center;padding:40px 20px">
    <section class="trial-card" style="max-width:620px;width:100%;margin:0">
      <img class="trial-logo" src="../assets/haqiq-logo-en.webp" alt="Haqiq" />
      <p class="kicker">7-day free trial</p>
      <h1 style="font-size:2rem;margin:.5rem 0 1rem">Verify your work email.</h1>
      <p id="verify-copy" class="trial-intro">Checking your verification link…</p>
      <div class="trial-status" id="verify-status" role="status" aria-live="polite"></div>
      <div class="trial-actions">
        <a class="button secondary" href="../">Back to Haqiq</a>
      </div>
    </section>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('verify-status');
      const copy=document.getElementById('verify-copy');
      const token=new URLSearchParams(location.search).get('token')||'';
      if(!token){copy.textContent='This verification link is invalid or expired.';status.className='trial-status error';return;}
      try{
        const response=await fetch('https://bdnjsszeprhztgjlfrdh.supabase.co/functions/v1/verify-trial',{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||'This verification link is invalid or expired.');
        copy.textContent='Your email is verified.';
        status.className='trial-status success';
        status.textContent='Your Haqiq trial request is now pending review. We will email you when your workspace is ready.';
        history.replaceState({},document.title,location.pathname);
      }catch(error){
        copy.textContent='We could not verify this link.';
        status.className='trial-status error';
        status.textContent=error instanceof Error?error.message:'This verification link is invalid or expired.';
      }
    })();
  </script>
</body>
</html>
